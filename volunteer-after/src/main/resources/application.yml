server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/volunteer?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    # 改成你本机 MySQL 的 root 密码
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: volunteer-secret-key-2026-must-be-at-least-32-bytes
  expire: 86400000
